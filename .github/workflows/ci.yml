name: CI
on:
  push:
    branches: [main]
    paths:
      - src/**/*.ts
      - tsconfig.json
      - package.json
      - package-lock.json
  pull_request:
    branches: [main]
    paths:
      - src/**/*.ts
      - tsconfig.json
      - package.json
      - package-lock.json
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
